<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X402TEST</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; background: #fff; color: #111; text-align: center; padding-top: 100px; }
    h1 { font-size: 28px; margin-bottom: 30px; }
    a { display: inline-block; margin: 10px; font-size: 18px; color: #007bff; text-decoration: underline; cursor: pointer; }
    a:hover { color: #0056b3; }
    #sold { margin-top: 40px; font-size: 16px; color: #333; }
  </style>
</head>
<body>
  <h1>X402TEST</h1>
  <a id="buy1">Small Buy (1 USDC)</a>
  <a id="buy10">Big Buy (10 USDC)</a>
  <div id="sold">Loading sold amount...</div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.min.js"></script>
  <script>
    const provider = new ethers.JsonRpcProvider('https://mainnet.base.org');
    const USDC = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
    const RECIPIENT = '0xb07E4c90B7E1e17Fd72Bb3aeaDe939b5D7C236e3';
    const CHAIN_ID = '0x2105'; // Base mainnet

    // Build transfer link (EIP-681)
    function buildLink(amountUSDC) {
      const amount = BigInt(amountUSDC) * 1000000n;
      return `ethereum:${USDC}/transfer?address=${RECIPIENT}&uint256=${amount.toString()}@8453`;
    }

    // Try deep link then fallback to sendTransaction
    async function trySend(amountUSDC) {
      try {
        if (!window.ethereum) {
          window.location.href = buildLink(amountUSDC);
          return;
        }
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_ID }] });
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        const from = accounts[0];
        const iface = new ethers.Interface(['function transfer(address to,uint256 amount) public returns (bool)']);
        const data = iface.encodeFunctionData('transfer', [RECIPIENT, BigInt(amountUSDC) * 1000000n]);
        await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from, to: USDC, data }] });
      } catch (e) {
        console.error(e);
        alert('Wallet connection failed or transaction rejected.');
      }
    }

    document.getElementById('buy1').onclick = () => trySend(1);
    document.getElementById('buy10').onclick = () => trySend(10);

    // Fetch sold amount periodically
    async function fetchSold() {
      try {
        const abi = ['function balanceOf(address) view returns (uint256)'];
        const usdc = new ethers.Contract(USDC, abi, provider);
        const bal = await usdc.balanceOf(RECIPIENT);
        const sold = Number(bal) / 1e6;
        document.getElementById('sold').innerText = `Total sold: ${sold.toLocaleString()} USDC`;
      } catch (e) {
        document.getElementById('sold').innerText = 'Error fetching sold amount';
      }
    }

    fetchSold();
    setInterval(fetchSold, 30000); // update every 30s
  </script>
</body>
</html>
