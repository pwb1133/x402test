<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HAWK | X402</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; color:#111; margin:0; padding:20px; background:#fff; }
    img.logo { width: 120px; display:block; margin-bottom:10px; }
    h1 { font-size:24px; margin-bottom:6px; }
    .subtitle { color:#555; font-size:14px; margin-bottom:14px; }
    a.link { display:inline-block; margin-right:12px; font-size:18px; color:#0b5ed7; text-decoration:underline; cursor:pointer; }
    #sent { font-size:16px; font-weight:500; margin-bottom:14px; }
    #msg { margin-top:16px; color:#444; white-space:pre-line; }
    #err { margin-top:8px; color:#b00020; white-space:pre-line; font-size:14px; }
  </style>
</head>
<body>
  <img src="hawk-logo.png" alt="HAWK Logo" class="logo" />
  <h1>HAWK | X402</h1>
  <div class="subtitle">Base Chain</div>
  <div id="sent">You sent: 0 USD</div>
  <a class="link" id="buy1">Small Buy (1 USDC)</a>
  <a class="link" id="buy10">Big Buy (10 USDC)</a>
  <a class="link" id="buy50">Whale Buy (50 USDC)</a>
  <div id="msg"></div>
  <div id="err"></div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
  <script>
    const provider = new ethers.JsonRpcProvider('https://mainnet.base.org');
    const CHAIN_ID = '0x2105';
    const USDC = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913';
    const PROJECT = '0xf8F6224250004A4Cd77f79253f5151232576eaAE'; // updated recipient
    const sentEl = document.getElementById('sent');
    const msg = document.getElementById('msg');
    const err = document.getElementById('err');

    function say(t){ msg.textContent = t; }
    function logErr(e){ console.error(e); err.textContent = e && e.message ? e.message : String(e); }

    async function ensureBase() {
      try {
        await window.ethereum.request({ method:'wallet_switchEthereumChain', params:[{ chainId: CHAIN_ID }] });
      } catch(e) {
        if (e.code === 4902) {
          await window.ethereum.request({
            method:'wallet_addEthereumChain',
            params:[{ chainId: CHAIN_ID, chainName:'Base Mainnet',
              nativeCurrency:{name:'ETH',symbol:'ETH',decimals:18},
              rpcUrls:['https://mainnet.base.org'],
              blockExplorerUrls:['https://basescan.org']
            }]
          });
        } else { throw e; }
      }
    }

    async function fetchTotalSent(myAddr){
      try {
        const iface = new ethers.Interface(['event Transfer(address indexed from, address indexed to, uint256 value)']);
        const topicTransfer = iface.getEventTopic('Transfer');
        const topics = [topicTransfer, ethers.zeroPadValue(myAddr, 32), ethers.zeroPadValue(PROJECT, 32)];
        const latest = await provider.getBlockNumber();
        const fromBlock = latest - 2000000; // roughly last few months
        const logs = await provider.getLogs({ address: USDC, fromBlock, toBlock: 'latest', topics });
        let total = 0n;
        for (const l of logs){
          const parsed = iface.parseLog(l);
          total += parsed.args.value;
        }
        const usd = Number(total) / 1e6;
        sentEl.textContent = `You sent: ${usd.toLocaleString(undefined,{maximumFractionDigits:2})} USD`;
      } catch(e){ logErr(e); }
    }

    async function send(usdcAmount){
      err.textContent = '';
      try {
        if(!window.ethereum){ say('MetaMask not found.'); return; }
        await ensureBase();
        const [from] = await window.ethereum.request({ method:'eth_requestAccounts' });
        say('Preparing transaction...');
        const iface = new ethers.Interface(['function transfer(address to,uint256 amount) returns (bool)']);
        const data = iface.encodeFunctionData('transfer',[PROJECT, BigInt(usdcAmount)*1000000n]);
        const txHash = await window.ethereum.request({
          method:'eth_sendTransaction',
          params:[{ from, to: USDC, data, value:'0x0' }]
        });
        say('Transaction sent: ' + txHash);
        setTimeout(()=>fetchTotalSent(from), 10000);
      } catch(e){ logErr(e); say('Error during transaction.'); }
    }

    document.getElementById('buy1').onclick = ()=>send(1);
    document.getElementById('buy10').onclick = ()=>send(10);
    document.getElementById('buy50').onclick = ()=>send(50);

    window.addEventListener('load', async()=>{
      try{
        const [from] = await window.ethereum.request({ method:'eth_requestAccounts' });
        fetchTotalSent(from);
      }catch(e){ /* not connected yet */ }
    });
  </script>
</body>
</html>
